<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dorion Player</title>

<style>
body{
    margin:0;
    background:#121212;
    font-family:Segoe UI, Arial;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.player{
    width:360px;
    background:#181818;
    border-radius:12px;
    padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
}

.header{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}

.cover{
    width:100%;
    height:200px;
    background:#333;
    border-radius:10px;
    margin-bottom:15px;
    background-size:cover;
    background-position:center;
}

.song-title{
    font-size:18px;
    font-weight:bold;
}

.artist{
    font-size:14px;
    color:#b3b3b3;
    margin-bottom:15px;
}

.progress-container{
    display:flex;
    align-items:center;
    gap:8px;
}

.progress{
    flex:1;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:15px;
}

.play-btn{
    background:#1db954;
    border:none;
    width:60px;
    height:60px;
    border-radius:50%;
    font-size:22px;
    color:black;
    cursor:pointer;
}

.play-btn:hover{
    background:#1ed760;
}

.small-btn{
    background:none;
    border:none;
    color:white;
    font-size:18px;
    cursor:pointer;
}

.volume{
    width:100%;
    margin-top:15px;
}

.playlist{
    margin-top:20px;
    max-height:120px;
    overflow:auto;
}

.song{
    padding:8px;
    cursor:pointer;
    border-radius:5px;
}

.song:hover{
    background:#282828;
}

.active{
    background:#1db954;
    color:black;
}

.time{
    font-size:12px;
    color:#b3b3b3;
}
</style>
</head>
<body>

<div class="player">

<div class="header">Dorion Player</div>

<div class="cover" id="cover"></div>

<div class="song-title" id="title">No song</div>
<div class="artist" id="artist">Artist</div>

<div class="progress-container">
<div class="time" id="current">0:00</div>
<input type="range" id="progress" class="progress" value="0">
<div class="time" id="duration">0:00</div>
</div>

<div class="controls">
<button class="small-btn" onclick="prev()">⏮</button>
<button class="play-btn" onclick="togglePlay()" id="playBtn">▶</button>
<button class="small-btn" onclick="next()">⏭</button>
</div>

<input type="range" id="volume" class="volume" min="0" max="1" step="0.01" value="1">

<div class="playlist" id="playlist"></div>

<audio id="audio"></audio>

</div>

<script>
const songs = [
{
    title:"Song 1",
    artist:"Dorion",
    src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
    cover:"https://picsum.photos/300?1"
},
{
    title:"Song 2",
    artist:"Dorion",
    src:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
    cover:"https://picsum.photos/300?2"
}
];

let current = 0;
const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");

function loadSong(index){
    current = index;
    const song = songs[index];
    audio.src = song.src;
    document.getElementById("title").textContent = song.title;
    document.getElementById("artist").textContent = song.artist;
    document.getElementById("cover").style.backgroundImage = `url(${song.cover})`;
    updatePlaylist();
    updatePlayButton();
}

function togglePlay(){
    if(audio.paused){
        audio.play();
    } else {
        audio.pause();
    }
    updatePlayButton();
}

function updatePlayButton(){
    playBtn.textContent = audio.paused ? "▶" : "⏸";
}

function next(){
    current = (current + 1) % songs.length;
    loadSong(current);
    audio.play();
}

function prev(){
    current = (current - 1 + songs.length) % songs.length;
    loadSong(current);
    audio.play();
}

audio.addEventListener("timeupdate", () => {
    progress.value = audio.duration ? (audio.currentTime / audio.duration) * 100 : 0;
    document.getElementById("current").textContent = formatTime(audio.currentTime);
    document.getElementById("duration").textContent = formatTime(audio.duration);
    updatePlayButton();
});

progress.addEventListener("input", () => {
    audio.currentTime = (progress.value / 100) * audio.duration;
});

volume.addEventListener("input", () => {
    audio.volume = volume.value;
});

function formatTime(sec){
    if(!sec) return "0:00";
    let m = Math.floor(sec / 60);
    let s = Math.floor(sec % 60);
    return m + ":" + (s < 10 ? "0" + s : s);
}

function updatePlaylist(){
    const list = document.getElementById("playlist");
    list.innerHTML = "";
    songs.forEach((song,i) => {
        const div = document.createElement("div");
        div.className = "song" + (i === current ? " active" : "");
        div.textContent = song.title + " — " + song.artist;
        div.onclick = () => {
            loadSong(i);
            audio.play();
        };
        list.appendChild(div);
    });
}

audio.addEventListener("ended", next);

loadSong(0);
</script>

</body>
</html>
